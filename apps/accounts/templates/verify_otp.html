<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันรหัส OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-2 text-center text-gray-800">ยืนยันรหัส OTP</h2>
        <p class="text-center text-gray-600 mb-6 text-sm">
            เราได้ส่งรหัส 6 หลักไปที่ <br>
            <span class="font-semibold text-blue-600">{{ email }}</span>
            {% if otp_ref %}
            <br>
            <span class="text-gray-500 mt-2 inline-block">Ref Code: <span class="font-mono font-bold">{{ otp_ref }}</span></span>
            {% endif %}
        </p>
        
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'verify_otp' %}">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="mb-6 text-center">
                <label class="block text-gray-700 text-sm font-bold mb-4" for="otp_code">
                    กรอกรหัส 6 หลัก
                </label>
                <input type="text" name="otp_code" id="otp_code" required maxlength="6" pattern="\d{6}"
                    class="w-full text-center text-3xl tracking-[1em] border-b-2 border-gray-300 focus:border-blue-500 focus:outline-none py-2 font-mono"
                    placeholder="000000" autofocus>
            </div>
            
            <button type="submit" 
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-200">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'request_otp' %}" class="text-sm text-blue-500 hover:underline">
                ย้อนกลับไปแก้ไขอีเมล
            </a>
        </div>
    </div>

    <script>
        document.getElementById('otp_code').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
