{% load static %}
<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Time Exchange application">
        <meta name="keywords" content="time exchange, time banking, community">
        <link rel="icon" href="{% static 'bomb.svg' %}" type="image/svg+xml">
        <title>Account</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
            {% if user.is_authenticated %}
                <h1 class="text-2xl font-bold mb-2 text-gray-800">ยินดีต้อนรับ</h1>
                <p class="text-gray-600 mb-6">
                    คุณเข้าสู่ระบบด้วยอีเมล<br>
                    <span class="font-semibold text-blue-600">{{ user.email }}</span>
                </p>
                <a href="{% url 'logout' %}" class="inline-block w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded transition duration-200">
                    ออกจากระบบ
                </a>
            {% else %}
                <h1 class="text-2xl font-bold mb-4 text-gray-800">Time Exchange</h1>
                <p class="text-gray-600 mb-6">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
                <a href="{% url 'request_otp' %}" class="inline-block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                    เข้าสู่ระบบ
                </a>
            {% endif %}
        </div>
    </body>
</html>
